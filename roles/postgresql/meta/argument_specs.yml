argument_specs:
  main:
    short_description: Main entry point for the postgresql role
    options:
      postgresql_version:
        description:
          - The version of PostgreSQL to install.
        type: str
        default: 18

      postgresql_authentication_records:
        description: >-
          Which hosts are allowed to connect, how clients are authenticated, which PostgreSQL user names they can use,
          which databases they can access.
        type: list
        elements: dict
        default:
            # "local" is for Unix domain socket connections only
          - { type: local, databases: [all], users: [all], method: trust }
            # IPv4 local connections:
          - { type: host, databases: [all], users: [all], address: 127.0.0.1/32, method: trust}
            # IPv6 local connections:
          - { type: host, databases: [all], users: [all], address: "::1/128", method: trust}
            # Allow replication connections from localhost, by a user with the
            # replication privilege.
          - { type: local, databases: [replication], users: [all], method: trust}
          - { type: host, databases: [replication], users: [all], address: 127.0.0.1/32, method: trust}
          - { type: host, databases: [replication], users: [all], address: "::1/128", method: trust}
        options:
          type:
            description:
              - The connection type
              - "`local` is a Unix-domain socket"
              - "`host` is a TCP/IP socket (encrypted or not)"
              - "`hostssl` is a TCP/IP socket that is SSL-encrypted"
              - "`hostnossl` is a TCP/IP socket that is not SSL-encrypted"
              - "`hostgssenc` is a TCP/IP socket that is GSSAPI-encrypted"
              - "`hostnogssenc` is a TCP/IP socket that is not GSSAPI-encrypted"
            type: str
            choices:
              - local
              - host
              - hostssl
              - hostnossl
              - hostgssenc
              - hostnogssenc
          databases:
            description:
              - The databases that a client may connect to.
              - >-
                Can be `all`, `sameuser`, `samerole`, `replication`, a database name, a regular expression (if it starts
                with a slash `/`).
              - Can be a file name prefixed with `@` to include names from a separate file.
              - >-
                The `all` keyword does not match `replication`. Access to replication must be enabled in a separate
                record.
              - >-
                Database names containing spaces, commas, quotes and other special characters must be quoted.
                Quoting one of the keywords `all`, `sameuser`, `samerole` or `replication` makes the name lose its
                special character, and just match a database with that name.
            type: list
            elements: str
            required: true
          users:
            description:
              - >-
                Can be `all`, a user name, a group name prefixed with `+`, a regular expression (if it starts with a
                slash `/`).
              - Can be a file name prefixed with `@` to include names from a separate file.
            type: list
            elements: str
            required: true
          address:
            description:
              - Specifies the set of hosts the record matches.
              - >-
                It can be a host name, or it is made up of an IP address and a CIDR mask that is an integer (between 0
                and 32 (IPv4) or 128 (IPv6) inclusive) that specifies the number of significant bits in the mask.
              - >-
                A host name that starts with a dot (.) matches a suffix of the actual host name. Alternatively, you can
                write an IP address and netmask in separate columns to specify the set of hosts.
              - >-
                Instead of a CIDR-address, you can write `samehost` to match any of the server's own IP addresses, or
                `samenet` to match any address in any subnet that the server is directly connected to.
            type: str
            required: false
          method:
            description:
              - >-
                Can be `trust`, `reject`, `md5`, `password`, `scram-sha-256`, `gss`, `sspi`, `ident`, `peer`, `pam`,
                `oauth`, `ldap`, `radius` or `cert`.
              - >-
                Note that `password` sends passwords in clear text; `md5` or `scram-sha-256` are preferred since they
                send encrypted passwords.
            type: str
            choices:
              - trust
              - reject
              - md5
              - password
              - scram-sha-256
              - gss
              - sspi
              - ident
              - peer
              - pam
              - oauth
              - ldap
              - radius
              - cert
            required: true
          options:
            description:
              - A set of options for the authentication.
              - >-
                The available options depend on the different authentication methods -- refer to the "Client
                Authentication" section in the documentation for a list of which options are available for which
                authentication methods.
            type: list
            elements: dict
            default: []
            options:
              name:
                description: The option name
                type: str
                required: true
              value:
                description: The option value
                type: str
                required: true

      postgresql_listen_addresses:
        description:
          - >-
            Specifies the TCP/IP address(es) on which the server is to listen for connections from client applications.
            The value takes the form of a comma-separated list of host names and/or numeric IP addresses. The special
            entry `*` corresponds to all available IP interfaces. The entry `0.0.0.0` allows listening for all IPv4
            addresses and `::` allows listening for all IPv6 addresses. If the list is empty, the server does not listen
            on any IP interface at all, in which case only Unix-domain sockets can be used to connect to it. If the list
            is not empty, the server will start if it can listen on at least one TCP/IP address. A warning will be
            emitted for any TCP/IP address which cannot be opened. The default value is localhost, which allows only
            local TCP/IP “loopback” connections to be made.
          - >-
            While client authentication allows fine-grained control over who can access the server, listen_addresses
            controls which interfaces accept connection attempts, which can help prevent repeated malicious connection
            requests on insecure network interfaces. This parameter can only be set at server start.
        type: list
        elements: str

      postgresql_port:
        description: >-
          The TCP port the server listens on; 5432 by default. Note that the same port number is used for all IP
          addresses the server listens on. This parameter can only be set at server start.
        type: int

      postgresql_max_connections:
        description:
          - >-
            Determines the maximum number of concurrent connections to the database server. The default is typically 100
            connections, but might be less if your kernel settings will not support it (as determined during initdb).
            This parameter can only be set at server start.
          - >-
            PostgreSQL sizes certain resources based directly on the value of `max_connections`. Increasing its value
            leads to higher allocation of those resources, including shared memory.
          - >-
            When running a standby server, you must set this parameter to the same or higher value than on the primary
            server. Otherwise, queries will not be allowed in the standby server.
        type: int
        default: 100

      postgresql_reserved_connections:
        description:
          - >-
            Determines the number of connection “slots” that are reserved for connections by roles with privileges of
            the `pg_use_reserved_connections` role. Whenever the number of free connection slots is greater than
            `superuser_reserved_connections` but less than or equal to the sum of `superuser_reserved_connections` and
            reserved_connections, new connections will be accepted only for superusers and roles with privileges of
            `pg_use_reserved_connections`. If `superuser_reserved_connections` or fewer connection slots are available,
            new connections will be accepted only for superusers.
          - >-
            The default value is zero connections. The value must be less than `max_connections` minus
            `superuser_reserved_connections`. This parameter can only be set at server start.
        type: int

      postgresql_superuser_reserved_connections:
        description:
          - >-
            Determines the number of connection “slots” that are reserved for connections by PostgreSQL superusers. At
            most `max_connections` connections can ever be active simultaneously. Whenever the number of active
            concurrent connections is at least `max_connections` minus `superuser_reserved_connections`, new connections
            will be accepted only for superusers. The connection slots reserved by this parameter are intended as final
            reserve for emergency use after the slots reserved by `reserved_connections` have been exhausted.
          - >-
            The default value is three connections. The value must be less than `max_connections` minus
            `reserved_connections`. This parameter can only be set at server start.
        type: int

      postgresql_unix_socket_directories:
        description:
          - >-
            Specifies the directory of the Unix-domain socket(s) on which the server is to listen for connections from
            client applications. An empty value specifies not listening on any Unix-domain sockets, in which case only
            TCP/IP sockets can be used to connect to the server.
          - >-
            A value that starts with `@` specifies that a Unix-domain socket in the abstract namespace should be created
            (currently supported on Linux only). In that case, this value does not specify a "directory" but a prefix
            from which the actual socket name is computed in the same manner as for the file-system namespace. While the
            abstract socket name prefix can be chosen freely, since it is not a file-system location, the convention is
            to nonetheless use file-system-like values such as `@/tmp`.
          - >-
            The default value is normally `/tmp`, but that can be changed at build time. On Windows, the default is
            empty, which means no Unix-domain socket is created by default. This parameter can only be set at server
            start.
          - >-
            In addition to the socket file itself, which is named `.s.PGSQL.nnnn` where `nnnn` is the server's port
            number, an ordinary file named `.s.PGSQL.nnnn.lock` will be created in each of the `unix_socket_directories`
            directories. Neither file should ever be removed manually. For sockets in the abstract namespace, no lock
            file is created.
        type: list
        elements: path

      postgresql_unix_socket_group:
        description:
          - >-
            Sets the owning group of the Unix-domain socket(s). (The owning user of the sockets is always the user that
            starts the server.) In combination with the parameter `unix_socket_permissions` this can be used as an
            additional access control mechanism for Unix-domain connections. By default this is the empty string, which
            uses the default group of the server user. This parameter can only be set at server start.
          - >-
            This parameter is not supported on Windows. Any setting will be ignored. Also, sockets in the abstract
            namespace have no file owner, so this setting is also ignored in that case.
        type: str

      postgresql_unix_socket_permissions:
        description:
          - >-
            Sets the access permissions of the Unix-domain socket(s). Unix-domain sockets use the usual Unix file system
            permission set. The parameter value is expected to be a numeric mode specified in the format accepted by the
            `chmod` and `umask` system calls. (To use the customary octal format the number must start with a `0`
            (zero).)
          - >-
            The default permissions are `0777`, meaning anyone can connect. Reasonable alternatives are `0770` (only
            user and group, see also `unix_socket_group`) and `0700` (only user). (Note that for a Unix-domain socket,
            only write permission matters, so there is no point in setting or revoking read or execute permissions.)
          - This access control mechanism is independent of the one described in Chapter 20.
          - This parameter can only be set at server start.
          - >-
            This parameter is irrelevant on systems, notably Solaris as of Solaris 10, that ignore socket permissions
            entirely. There, one can achieve a similar effect by pointing `unix_socket_directories` to a directory
            having search permission limited to the desired audience.
          - Sockets in the abstract namespace have no file permissions, so this setting is also ignored in that case.
        type: str

      postgresql_bonjour:
        description: >-
          Enables advertising the server's existence via Bonjour. The default is off. This parameter can only be set at
          server start.
        type: bool

      postgresql_bonjour_name:
        description: >-
          Specifies the Bonjour service name. The computer name is used if this parameter is set to the empty string
          `''` (which is the default). This parameter is ignored if the server was not compiled with Bonjour support.
          This parameter can only be set at server start.
        type: str

      postgresql_tcp_keepalives_idle:
        description: >-
          Specifies the amount of time with no network activity after which the operating system should send a TCP
          keepalive message to the client. If this value is specified without units, it is taken as seconds. A value of
          0 (the default) selects the operating system's default. On Windows, setting a value of 0 will set this
          parameter to 2 hours, since Windows does not provide a way to read the system default value. This parameter is
          supported only on systems that support `TCP_KEEPIDLE` or an equivalent socket option, and on Windows; on other
          systems, it must be zero. In sessions connected via a Unix-domain socket, this parameter is ignored and always
          reads as zero.
        type: int

      postgresql_tcp_keepalives_interval:
        description: >-
          Specifies the amount of time after which a TCP keepalive message that has not been acknowledged by the client
          should be retransmitted. If this value is specified without units, it is taken as seconds. A value of 0 (the
          default) selects the operating system's default. On Windows, setting a value of 0 will set this parameter to 1
          second, since Windows does not provide a way to read the system default value. This parameter is supported
          only on systems that support `TCP_KEEPINTVL` or an equivalent socket option, and on Windows; on other systems,
          it must be zero. In sessions connected via a Unix-domain socket, this parameter is ignored and always reads as
          zero.
        type: int

      postgresql_tcp_keepalives_count:
        description: >-
          Specifies the number of TCP keepalive messages that can be lost before the server's connection to the client
          is considered dead. A value of 0 (the default) selects the operating system's default. This parameter is
          supported only on systems that support `TCP_KEEPCNT` or an equivalent socket option (which does not include
          Windows); on other systems, it must be zero. In sessions connected via a Unix-domain socket, this parameter is
          ignored and always reads as zero.
        type: int

      postgresql_tcp_user_timeout:
        description: >-
          Specifies the amount of time that transmitted data may remain unacknowledged before the TCP connection is
          forcibly closed. If this value is specified without units, it is taken as milliseconds. A value of 0 (the
          default) selects the operating system's default. This parameter is supported only on systems that support
          `TCP_USER_TIMEOUT` (which does not include Windows); on other systems, it must be zero. In sessions connected
          via a Unix-domain socket, this parameter is ignored and always reads as zero.
        type: int

      postgresql_client_connection_check_interval:
        description:
          - >-
            Sets the time interval between optional checks that the client is still connected, while running queries.
            The check is performed by polling the socket, and allows long running queries to be aborted sooner if the
            kernel reports that the connection is closed.
          - >-
            This option relies on kernel events exposed by Linux, macOS, illumos and the BSD family of operating
            systems, and is not currently available on other systems.
          - >-
            If the value is specified without units, it is taken as milliseconds. The default value is 0, which disables
            connection checks. Without connection checks, the server will detect the loss of the connection only at the
            next interaction with the socket, when it waits for, receives or sends data.
          - >-
            For the kernel itself to detect lost TCP connections reliably and within a known timeframe in all scenarios
            including network failure, it may also be necessary to adjust the TCP keepalive settings of the operating
            system, or the tcp_keepalives_idle, tcp_keepalives_interval and tcp_keepalives_count settings of PostgreSQL.
        type: int

      postgresql_authentication_timeout:
        description: >-
          Maximum amount of time allowed to complete client authentication. If a would-be client has not completed the
          authentication protocol in this much time, the server closes the connection. This prevents hung clients from
          occupying a connection indefinitely. If this value is specified without units, it is taken as seconds. The
          default is one minute (`1m`). This parameter can only be set in the `postgresql.conf` file or on the server
          command line.
        type: str

      postgresql_password_encryption:
        description:
          - >-
            When a password is specified in CREATE ROLE or ALTER ROLE, this parameter determines the algorithm to use to
            encrypt the password. Possible values are `scram-sha-256`, which will encrypt the password with
            SCRAM-SHA-256, and `md5`, which stores the password as an MD5 hash. The default is `scram-sha-256`.
          - >-
            Note that older clients might lack support for the SCRAM authentication mechanism, and hence not work with
            passwords encrypted with SCRAM-SHA-256. See Section 20.5 for more details.
          - >-
            Warning - Support for MD5-encrypted passwords is deprecated and will be removed in a future release of
            PostgreSQL. Refer to Section 20.5 for details about migrating to another password type.
        type: str
        choices:
          - scram-sha-256
          - md5

      postgresql_scram_iterations:
        description:
          - >-
            The number of computational iterations to be performed when encrypting a password using SCRAM-SHA-256. The
            default is `4096`. A higher number of iterations provides additional protection against brute-force attacks
            on stored passwords, but makes authentication slower. Changing the value has no effect on existing passwords
            encrypted with SCRAM-SHA-256 as the iteration count is fixed at the time of encryption. In order to make use
            of a changed value, a new password must be set.
          - >-
            Note - If a role password was created with a different iteration count than the value of scram_iterations
            specified in the `postgresql.conf` file or on the server command line, an unauthenticated user can discern the
            existence of the role by observing discrepancies in the server's responses to connection attempts. If you
            find this concerning, ensure that all role passwords are created with scram_iterations set to the value
            specified in the `postgresql.conf` file or on the server command line.
        type: int

      postgresql_md5_password_warnings:
        description: >-
          Controls whether a `WARNING` about MD5 password deprecation is produced when a `CREATE ROLE` or `ALTER ROLE`
          statement sets an MD5-encrypted password.
        type: bool

      postgresql_krb_server_keyfile:
        type: str
        description: >-
          Sets the location of the server's Kerberos key file. The default is `FILE:/usr/local/pgsql/etc/krb5.keytab`
          (where the directory part is whatever was specified as `sysconfdir` at build time; use
          `pg_config --sysconfdir` to determine that). If this parameter is set to an empty string, it is ignored and a
          system-dependent default is used. This parameter can only be set in the `postgresql.conf` file or on the
          server command line. See Section 20.6 for more information.
        default: FILE:${sysconfdir}/krb5.keytab

      postgresql_krb_caseins_users:
        type: bool
        description: >-
          Sets whether GSSAPI user names should be treated case-insensitively. The default is off (case sensitive). This
          parameter can only be set in the `postgresql.conf` file or on the server command line.

      postgresql_gss_accept_delegation:
        type: bool
        description: >-
          Sets whether GSSAPI delegation should be accepted from the client. The default is off meaning credentials from
          the client will not be accepted. Changing this to on will make the server accept credentials delegated to it
          from the client. This parameter can only be set in the `postgresql.conf` file or on the server command line.

      postgresql_oauth_validator_libraries:
        type: str
        description:
          - >-
            The library/libraries to use for validating OAuth connection tokens. If only one validator library is
            provided, it will be used by default for any OAuth connections; otherwise, all oauth HBA entries must
            explicitly set a validator chosen from this list. If set to an empty string (the default), OAuth connections
            will be refused. This parameter can only be set in the `postgresql.conf` file.
          - >-
            Validator modules must be implemented/obtained separately; PostgreSQL does not ship with any default
            implementations. For more information on implementing OAuth validators, see Chapter 50.

      postgresql_ssl:
        type: bool
        description: >-
          Enables SSL connections. This parameter can only be set in the `postgresql.conf` file or on the server command
          line. The default is off.

      postgresql_ssl_ca_file:
        type: str
        description: >-
          Specifies the name of the file containing the SSL server certificate authority (CA). Relative paths are
          relative to the data directory. This parameter can only be set in the `postgresql.conf` file or on the server
          command line. The default is empty, meaning no CA file is loaded, and client certificate verification is not
          performed.

      postgresql_ssl_cert_file:
        type: path
        description: >-
          Specifies the name of the file containing the SSL server certificate. Relative paths are relative to the data
          directory. This parameter can only be set in the `postgresql.conf` file or on the server command line. The
          default is `server.crt`.

      postgresql_ssl_crl_file:
        type: path
        description: >-
          Specifies the name of the file containing the SSL client certificate revocation list (CRL). Relative paths are
          relative to the data directory. This parameter can only be set in the `postgresql.conf` file or on the server
          command line. The default is empty, meaning no CRL file is loaded (unless ssl_crl_dir is set).

      postgresql_ssl_crl_dir:
        type: path
        description:
          - >-
            Specifies the name of the directory containing the SSL client certificate revocation list (CRL). Relative
            paths are relative to the data directory. This parameter can only be set in the `postgresql.conf` file or on
            the server command line. The default is empty, meaning no CRLs are used (unless ssl_crl_file is set).
          - >-
            The directory needs to be prepared with the OpenSSL command `openssl rehash` or `c_rehash`. See its
            documentation for details.
          - >-
            When using this setting, CRLs in the specified directory are loaded on-demand at connection time. New CRLs
            can be added to the directory and will be used immediately. This is unlike ssl_crl_file, which causes the
            CRL in the file to be loaded at server start time or when the configuration is reloaded. Both settings can
            be used together.

      postgresql_ssl_key_file:
        type: path
        description: >-
          Specifies the name of the file containing the SSL server private key. Relative paths are relative to the data
          directory. This parameter can only be set in the `postgresql.conf` file or on the server command line. The
          default is `server.key`.

      postgresql_ssl_tls13_ciphers:
        type: list
        elements: str
        description:
          - >-
            Specifies a list of cipher suites that are allowed by connections using TLS version 1.3. Multiple cipher
            suites can be specified by using a colon separated list. If left blank, the default set of cipher suites in
            OpenSSL will be used.
          - >-
            This parameter can only be set in the `postgresql.conf` file or on the server command line.

      postgresql_ssl_ciphers:
        type: list
        elements: str
        description:
          - >-
            Specifies a list of SSL ciphers that are allowed by connections using TLS version 1.2 and lower, see
            ssl_tls13_ciphers for TLS version 1.3 connections. See the ciphers manual page in the OpenSSL package for
            the syntax of this setting and a list of supported values. The default value is `HIGH:MEDIUM:+3DES:!aNULL`.
            The default is usually a reasonable choice unless you have specific security requirements.
          - >-
            This parameter can only be set in the `postgresql.conf` file or on the server command line.
          - >-
            `HIGH`: Cipher suites that use ciphers from `HIGH` group (e.g., AES, Camellia, 3DES)
          - >-
            `MEDIUM`: Cipher suites that use ciphers from `MEDIUM` group (e.g., RC4, SEED)
          - >-
            `+3DES`: The OpenSSL default order for `HIGH` is problematic because it orders 3DES higher than AES128. This
            is wrong because 3DES offers less security than AES128, and it is also much slower. +3DES reorders it after
            all other HIGH and MEDIUM ciphers.
          - >-
            `!aNULL`: Disables anonymous cipher suites that do no authentication. Such cipher suites are vulnerable to
            MITM attacks and therefore should not be used.
          - >-
            Available cipher suite details will vary across OpenSSL versions. Use the command
            `openssl ciphers -v 'HIGH:MEDIUM:+3DES:!aNULL'` to see actual details for the currently installed OpenSSL
            version. Note that this list is filtered at run time based on the server key type.

      postgresql_ssl_prefer_server_ciphers:
        type: bool
        description:
          - >-
            Specifies whether to use the server's SSL cipher preferences, rather than the client's. This parameter can
            only be set in the `postgresql.conf` file or on the server command line. The default is on.
          - >-
            PostgreSQL versions before 9.4 do not have this setting and always use the client's preferences.
            This setting is mainly for backward compatibility with those versions. Using the server's preferences is
            usually better because it is more likely that the server is appropriately configured.

      postgresql_ssl_groups:
        type: list
        elements: str
        description:
          - >-
            Specifies the named group to use for TLS key exchange. It needs to be supported by all clients that connect.
            Multiple groups can be specified by using a colon-separated list. It does not need to match the key type
            used by the server certificate. This parameter can only be set in the `postgresql.conf` file or on the
            server command line. The default is `X25519:prime256v1`.
          - >-
            OpenSSL names for the most common groups are: `prime256v1` (NIST P-256), `secp384r1` (NIST P-384),
            `secp521r1` (NIST P-521). An incomplete list of available groups can be shown with the command
            `openssl ecparam -list_curves`. Not all of them are usable with TLS though, and many supported group names
            and aliases are omitted.
          - >-
            In PostgreSQL versions before 18.0 this setting was named `ssl_ecdh_curve` and only accepted a single value.

      postgresql_ssl_min_protocol_version:
        type: str
        choices:
          - TLSv1
          - TLSv1.1
          - TLSv1.2
          - TLSv1.3
        description:
          - >-
            Sets the minimum SSL/TLS protocol version to use. Valid values are currently: `TLSv1`, `TLSv1.1`, `TLSv1.2`,
            `TLSv1.3`. Older versions of the OpenSSL library do not support all values; an error will be raised if an
            unsupported setting is chosen. Protocol versions before TLS 1.0, namely SSL version 2 and 3, are always
            disabled.
          - >-
            The default is `TLSv1.2`, which satisfies industry best practices as of this writing.
          - >-
            This parameter can only be set in the `postgresql.conf` file or on the server command line.

      postgresql_ssl_max_protocol_version:
        type: str
        choices:
          - ""
          - TLSv1
          - TLSv1.1
          - TLSv1.2
          - TLSv1.3
        description:
          - >-
            Sets the maximum SSL/TLS protocol version to use. Valid values are as for ssl_min_protocol_version, with
            addition of an empty string, which allows any protocol version. The default is to allow any version. Setting
            the maximum protocol version is mainly useful for testing or if some component has issues working with a
            newer protocol.
          - >-
            This parameter can only be set in the `postgresql.conf` file or on the server command line.

      postgresql_ssl_dh_params_file:
        type: path
        description:
          - >-
            Specifies the name of the file containing Diffie-Hellman parameters used for so-called ephemeral DH family
            of SSL ciphers. The default is empty, in which case compiled-in default DH parameters used. Using custom DH
            parameters reduces the exposure if an attacker manages to crack the well-known compiled-in DH parameters.
            You can create your own DH parameters file with the command `openssl dhparam -out dhparams.pem 2048`.
          - >-
            This parameter can only be set in the `postgresql.conf` file or on the server command line.

      postgresql_ssl_passphrase_command:
        type: str
        description:
          - >-
            Sets an external command to be invoked when a passphrase for decrypting an SSL file such as a private key
            needs to be obtained. By default, this parameter is empty, which means the built-in prompting mechanism is
            used.
          - >-
            The command must print the passphrase to the standard output and exit with code 0. In the parameter value,
            `%p` is replaced by a prompt string. (Write `%%` for a literal `%`.) Note that the prompt string will
            probably contain whitespace, so be sure to quote adequately. A single newline is stripped from the end of
            the output if present.
          - >-
            The command does not actually have to prompt the user for a passphrase. It can read it from a file, obtain
            it from a keychain facility, or similar. It is up to the user to make sure the chosen mechanism is
            adequately secure.
          - >-
            This parameter can only be set in the `postgresql.conf` file or on the server command line.

      postgresql_ssl_passphrase_command_supports_reload:
        type: bool
        description:
          - >-
            This parameter determines whether the passphrase command set by ssl_passphrase_command will also be called
            during a configuration reload if a key file needs a passphrase. If this parameter is off (the default), then
            ssl_passphrase_command will be ignored during a reload and the SSL configuration will not be reloaded if a
            passphrase is needed. That setting is appropriate for a command that requires a TTY for prompting, which
            might not be available when the server is running. Setting this parameter to on might be appropriate if the
            passphrase is obtained from a file, for example.
          - >-
            This parameter must be set to on when running on Windows since all connections will perform a configuration
            reload due to the different process model of that platform.
          - >-
            This parameter can only be set in the `postgresql.conf` file or on the server command line.

      postgresql_shared_buffers:
        type: str
        description:
          - >-
            Sets the amount of memory the database server uses for shared memory buffers. The default is typically 128
            egabytes (`128MB`), but might be less if your kernel settings will not support it (as determined during
            initdb). This setting must be at least 128 kilobytes. However, settings significantly higher than the
            minimum are usually needed for good performance. If this value is specified without units, it is taken as
            blocks, that is `BLCKSZ` bytes, typically 8kB. (Non-default values of `BLCKSZ` change the minimum value.)
            This parameter can only be set at server start.
          - >-
            If you have a dedicated database server with 1GB or more of RAM, a reasonable starting value for
            `shared_buffers` is 25% of the memory in your system. There are some workloads where even larger settings
            for `shared_buffers` are effective, but because PostgreSQL also relies on the operating system cache, it is
            unlikely that an allocation of more than 40% of RAM to `shared_buffers` will work better than a smaller
            amount. Larger settings for `shared_buffers` usually require a corresponding increase in `max_wal_size`, in
            order to spread out the process of writing large quantities of new or changed data over a longer period of
            time.
          - >-
            On systems with less than 1GB of RAM, a smaller percentage of RAM is appropriate, so as to leave adequate
            space for the operating system.
        default: 128MB

      postgresql_huge_pages:
        type: str
        choices:
          - "try"
          - "on"
          - "off"
        description:
          - >-
            Controls whether huge pages are requested for the main shared memory area. Valid values are `try` (the
            default), `on`, and o`ff. This parameter can only be set at server start. With huge_pages set to `try`, the
            server will try to request huge pages, but fall back to the default if that fails. With `on`, failure to
            request huge pages will prevent the server from starting up. With `off`, huge pages will not be requested.
            The actual state of huge pages is indicated by the server variable `huge_pages_status`.
          - >-
            At present, this setting is supported only on Linux and Windows. The setting is ignored on other systems
            when set to `try`. On Linux, it is only supported when `shared_memory_type` is set to `mmap` (the default).
          - >-
            The use of huge pages results in smaller page tables and less CPU time spent on memory management,
            increasing performance. For more details about using huge pages on Linux, see Section 18.4.5.
          - >-
            Huge pages are known as large pages on Windows. To use them, you need to assign the user right "Lock pages
            in memory" to the Windows user account that runs PostgreSQL. You can use Windows Group Policy tool
            (gpedit.msc) to assign the user right “Lock pages in memory”. To start the database server on the command
            prompt as a standalone process, not as a Windows service, the command prompt must be run as an administrator
            or User Access Control (UAC) must be disabled. When the UAC is enabled, the normal command prompt revokes
            the user right “Lock pages in memory” when started.
          - >-
            Note that this setting only affects the main shared memory area. Operating systems such as Linux, FreeBSD,
            and Illumos can also use huge pages (also known as “super” pages or “large” pages) automatically for normal
            memory allocation, without an explicit request from PostgreSQL. On Linux, this is called “transparent huge
            pages” (THP). That feature has been known to cause performance degradation with PostgreSQL for some users on
            some Linux versions, so its use is currently discouraged (unlike explicit use of `huge_pages`).

      postgresql_huge_page_size:
        type: str
        description:
          - >-
            Controls the size of huge pages, when they are enabled with huge_pages. The default is zero (`0`). When set
            to `0`, the default huge page size on the system will be used. This parameter can only be set at server
            start.
          - >-
            Some commonly available page sizes on modern 64 bit server architectures include: `2MB` and `1GB` (Intel and
            AMD), `16MB` and `16GB` (IBM POWER), and `64kB`, `2MB`, `32MB` and `1GB` (ARM). For more information about
            usage and support, see Section 18.4.5.
          - Non-default settings are currently supported only on Linux.

      postgresql_temp_buffers:
        type: str
        description:
          - >-
            Sets the maximum amount of memory used for temporary buffers within each database session. These are
            session-local buffers used only for access to temporary tables. If this value is specified without units, it
            is taken as blocks, that is `BLCKSZ` bytes, typically 8kB. The default is eight megabytes (`8MB`). (If
            `BLCKSZ` is not 8kB, the default value scales proportionally to it.) This setting can be changed within
            individual sessions, but only before the first use of temporary tables within the session; subsequent
            attempts to change the value will have no effect on that session.
          - >-
            A session will allocate temporary buffers as needed up to the limit given by `temp_buffers`. The cost of
            setting a large value in sessions that do not actually need many temporary buffers is only a buffer
            descriptor, or about 64 bytes, per increment in `temp_buffers`. However if a buffer is actually used an
            additional 8192 bytes will be consumed for it (or in general, `BLCKSZ` bytes).

      postgresql_max_prepared_transactions:
        type: int
        description:
          - >-
            Sets the maximum number of transactions that can be in the “prepared” state simultaneously (see PREPARE
            TRANSACTION). Setting this parameter to zero (which is the default) disables the prepared-transaction
            feature. This parameter can only be set at server start.
          - >-
            If you are not planning to use prepared transactions, this parameter should be set to zero to prevent
            accidental creation of prepared transactions. If you are using prepared transactions, you will probably want
            `max_prepared_transactions` to be at least as large as max_connections, so that every session can have a
            prepared transaction pending.
          - >-
            When running a standby server, you must set this parameter to the same or higher value than on the primary
            server. Otherwise, queries will not be allowed in the standby server.

      postgresql_work_mem:
        type: str
        description:
          - >-
            Sets the base maximum amount of memory to be used by a query operation (such as a sort or hash table) before
            writing to temporary disk files. If this value is specified without units, it is taken as kilobytes. The
            default value is four megabytes (`4MB`). Note that a complex query might perform several sort and hash
            operations at the same time, with each operation generally being allowed to use as much memory as this value
            specifies before it starts to write data into temporary files. Also, several running sessions could be doing
            such operations concurrently. Therefore, the total memory used could be many times the value of `work_mem`;
            it is necessary to keep this fact in mind when choosing the value. Sort operations are used for `ORDER BY`,
            `DISTINCT`, and merge joins. Hash tables are used in hash joins, hash-based aggregation, memoize nodes and
            hash-based processing of `IN` subqueries.
          - >-
            Hash-based operations are generally more sensitive to memory availability than equivalent sort-based
            operations. The memory limit for a hash table is computed by multiplying `work_mem` by
            `hash_mem_multiplier`. This makes it possible for hash-based operations to use an amount of memory that
            exceeds the usual `work_mem` base amount.

      postgresql_hash_mem_multiplier:
        type: float
        description:
          - >-
            Used to compute the maximum amount of memory that hash-based operations can use. The final limit is
            determined by multiplying `work_mem` by `hash_mem_multiplier`. The default value is 2.0, which makes
            hash-based operations use twice the usual work_mem base amount.
          - >-
            Consider increasing hash_mem_multiplier in environments where spilling by query operations is a regular
            occurrence, especially when simply increasing `work_mem` results in memory pressure (memory pressure
            typically takes the form of intermittent out of memory errors). The default setting of 2.0 is often
            effective with mixed workloads. Higher settings in the range of 2.0 - 8.0 or more may be effective in
            environments where `work_mem` has already been increased to 40MB or more.

      postgresql_maintenance_work_mem:
        type: str
        description:
          - >-
            Specifies the maximum amount of memory to be used by maintenance operations, such as `VACUUM`,
            `CREATE INDEX`, and `ALTER TABLE ADD FOREIGN KEY`. If this value is specified without units, it is taken as
            kilobytes. It defaults to 64 megabytes (`64MB`). Since only one of these operations can be executed at a
            time by a database session, and an installation normally doesn't have many of them running concurrently,
            it's safe to set this value significantly larger than `work_mem`. Larger settings might improve performance
            for vacuuming and for restoring database dumps.
          - >-
            Note that when `autovacuum` runs, up to `autovacuum_max_workers` times this memory may be allocated, so be
            careful not to set the default value too high. It may be useful to control for this by separately setting
            `autovacuum_work_mem`.

      postgresql_autovacuum_work_mem:
        type: str
        description: >-
          Specifies the maximum amount of memory to be used by each autovacuum worker process. If this value is
          specified without units, it is taken as kilobytes. It defaults to -1, indicating that the value of
          `maintenance_work_mem` should be used instead. The setting has no effect on the behavior of `VACUUM` when run
          in other contexts. This parameter can only be set in the `postgresql.conf` file or on the server command line.

      postgresql_vacuum_buffer_usage_limit:
        type: str
        description: >-
          Specifies the size of the Buffer Access Strategy used by the `VACUUM` and `ANALYZE` commands. A setting of `0`
          will allow the operation to use any number of `shared_buffers`. Otherwise valid sizes range from `128 kB` to
          `16 GB`. If the specified size would exceed 1/8 the size of `shared_buffers`, the size is silently capped to
          that value. The default value is `2MB`. If this value is specified without units, it is taken as kilobytes.
          This parameter can be set at any time. It can be overridden for `VACUUM` and `ANALYZE` when passing the
          `BUFFER_USAGE_LIMIT` option. Higher settings can allow `VACUUM` and `ANALYZE` to run more quickly, but having
          too large a setting may cause too many other useful pages to be evicted from shared buffers.

      postgresql_logical_decoding_work_mem:
        type: str
        description:
          Specifies the maximum amount of memory to be used by logical decoding, before some of the decoded changes are
          written to local disk. This limits the amount of memory used by logical streaming replication connections. It
          defaults to 64 megabytes (`64MB`). Since each replication connection only uses a single buffer of this size,
          and an installation normally doesn't have many such connections concurrently (as limited by
          `max_wal_senders`), it's safe to set this value significantly higher than `work_mem`, reducing the amount of
          decoded changes written to disk.

      postgresql_commit_timestamp_buffers:
        type: str
        description: >-
          Specifies the amount of memory to use to cache the contents of `pg_commit_ts` (see Table 66.1). If this value
          is specified without units, it is taken as blocks, that is `BLCKSZ` bytes, typically 8kB. The default value is
          `0`, which requests `shared_buffers`/512 up to 1024 blocks, but not fewer than 16 blocks. This parameter can
          only be set at server start.

      postgresql_multixact_member_buffers:
        type: str
        description: >-
          Specifies the amount of shared memory to use to cache the contents of `pg_multixact/members` (see Table 66.1).
          If this value is specified without units, it is taken as blocks, that is `BLCKSZ` bytes, typically 8kB. The
          default value is `32`. This parameter can only be set at server start.

      postgresql_multixact_offset_buffers:
        type: str
        description: >-
          Specifies the amount of shared memory to use to cache the contents of `pg_multixact/offsets` (see Table 66.1).
          If this value is specified without units, it is taken as blocks, that is `BLCKSZ` bytes, typically 8kB. The
          default value is `16`. This parameter can only be set at server start.

      postgresql_notify_buffers:
        type: str
        description: >-
          Specifies the amount of shared memory to use to cache the contents of `pg_notify` (see Table 66.1). If this
          value is specified without units, it is taken as blocks, that is `BLCKSZ` bytes, typically 8kB. The default
          value is `16`. This parameter can only be set at server start.

      postgresql_serializable_buffers:
        type: str
        description: >-
          Specifies the amount of shared memory to use to cache the contents of `pg_serial` (see Table 66.1). If this
          value is specified without units, it is taken as blocks, that is `BLCKSZ` bytes, typically 8kB. The default
          value is 32. This parameter can only be set at server start.

      postgresql_subtransaction_buffers:
        type: str
        description: >-
          Specifies the amount of shared memory to use to cache the contents of `pg_subtrans` (see Table 66.1). If this
          value is specified without units, it is taken as blocks, that is `BLCKSZ` bytes, typically 8kB. The default
          value is 0, which requests `shared_buffers`/512 up to 1024 blocks, but not fewer than 16 blocks. This
          parameter can only be set at server start.

      postgresql_transaction_buffers:
        type: str
        description: >-
          Specifies the amount of shared memory to use to cache the contents of `pg_xact` (see Table 66.1). If this
          value is specified without units, it is taken as blocks, that is `BLCKSZ` bytes, typically 8kB. The default
          value is 0, which requests `shared_buffers`/512 up to 1024 blocks, but not fewer than 16 blocks. This
          parameter can only be set at server start.

      postgresql_max_stack_depth:
        type: str
        description:
          - >-
            Specifies the maximum safe depth of the server's execution stack. The ideal setting for this parameter is
            the actual stack size limit enforced by the kernel (as set by `ulimit -s` or local equivalent), less a
            safety margin of a megabyte or so. The safety margin is needed because the stack depth is not checked in
            every routine in the server, but only in key potentially-recursive routines. If this value is specified
            without units, it is taken as kilobytes. The default setting is two megabytes (`2MB`), which is
            conservatively small and unlikely to risk crashes. However, it might be too small to allow execution of
            complex functions. Only superusers and users with the appropriate `SET` privilege can change this setting.
          - >-
            Setting max_stack_depth higher than the actual kernel limit will mean that a runaway recursive function can
            crash an individual backend process. On platforms where PostgreSQL can determine the kernel limit, the
            server will not allow this variable to be set to an unsafe value. However, not all platforms provide the
            information, so caution is recommended in selecting a value.

      postgresql_shared_memory_type:
        type: str
        choices:
          - mmap
          - sysv
          - windows
        description: >-
          Specifies the shared memory implementation that the server should use for the main shared memory region that
          holds PostgreSQL's shared buffers and other shared data. Possible values are `mmap` (for anonymous shared
          memory allocated using `mmap`), `sysv` (for System V shared memory allocated via `shmget`) and `windows` (for
          Windows shared memory). Not all values are supported on all platforms; the first supported option is the
          default for that platform. The use of the `sysv` option, which is not the default on any platform, is
          generally discouraged because it typically requires non-default kernel settings to allow for large allocations
          (see Section 18.4.1). This parameter can only be set at server start.

      postgresql_dynamic_shared_memory_type:
        type: str
        choices:
          - posix
          - sysv
          - windows
          - mmap
        description: >-
          Specifies the dynamic shared memory implementation that the server should use. Possible values are `posix`
          (for POSIX shared memory allocated using `shm_open`), `sysv` (for System V shared memory allocated via
          `shmget`), `windows` (for Windows shared memory), and `mmap` (to simulate shared memory using memory-mapped
          files stored in the data directory). Not all values are supported on all platforms; the first supported option
          is usually the default for that platform. The use of the `mmap` option, which is not the default on any
          platform, is generally discouraged because the operating system may write modified pages back to disk
          repeatedly, increasing system I/O load; however, it may be useful for debugging, when the `pg_dynshmem`
          directory is stored on a RAM disk, or when other shared memory facilities are not available. This parameter
          can only be set at server start.
        default: posix

      postgresql_min_dynamic_shared_memory:
        type: str
        description: >-
          Specifies the amount of memory that should be allocated at server startup for use by parallel queries. When
          this memory region is insufficient or exhausted by concurrent queries, new parallel queries try to allocate
          extra shared memory temporarily from the operating system using the method configured with
          `dynamic_shared_memory_type`, which may be slower due to memory management overheads. Memory that is allocated
          at startup with `min_dynamic_shared_memory` is affected by the `huge_pages` setting on operating systems where
          that is supported, and may be more likely to benefit from larger pages on operating systems where that is
          managed automatically. The default value is `0` (none). This parameter can only be set at server start.

      postgresql_temp_file_limit:
        type: str
        description:
          - >-
            Specifies the maximum amount of disk space that a process can use for temporary files, such as sort and hash
            temporary files, or the storage file for a held cursor. A transaction attempting to exceed this limit will
            be canceled. If this value is specified without units, it is taken as kilobytes. `-1` (the default) means no
            limit. Only superusers and users with the appropriate `SET` privilege can change this setting.
          - >-
            This setting constrains the total space used at any instant by all temporary files used by a given
            PostgreSQL process. It should be noted that disk space used for explicit temporary tables, as opposed to
            temporary files used behind-the-scenes in query execution, does not count against this limit.
        default: "-1"

      postgresql_file_copy_method:
        type: str
        choices:
          - copy
          - clone
        description:
          - >-
            Specifies the method used to copy files. Possible values are `COPY` (default) and `CLONE` (if operating
            support is available).
          - >-
            This parameter affects: `CREATE DATABASE ... STRATEGY=FILE_COPY`, `ALTER DATABASE ... SET TABLESPACE ...`
          - >-
            `CLONE` uses the `copy_file_range()` (Linux, FreeBSD) or `copyfile` (macOS) system calls, giving the kernel
            the opportunity to share disk blocks or push work down to lower layers on some file systems.

      postgresql_file_extend_method:
        type: str
        choices:
          - posix_fallocate
          - write_zeros
        description:
          - >-
            Specifies the method used to extend data files during bulk operations such as `COPY`. The first available
            option is used as the default, depending on the operating system:
          - >-
            `posix_fallocate` (Unix) uses the standard POSIX interface for allocating disk space, but is missing on some
            systems. If it is present but the underlying file system doesn't support it, this option silently falls back
            to `write_zeros`. Current versions of BTRFS are known to disable compression when this option is used. This
            is the default on systems that have the function.
          - >-
            `write_zeros` extends files by writing out blocks of zero bytes. This is the default on systems that don't
            have the function `posix_fallocate`.
          - >-
            The write_zeros method is always used when data files are extended by 8 blocks or fewer.

      postgresql_max_notify_queue_pages:
        type: int
        description: >-
          Specifies the maximum amount of allocated pages for NOTIFY / LISTEN queue. The default value is 1048576.
          For 8 KB pages it allows to consume up to 8 GB of disk space. This parameter can only be set at server start.

      postgresql_max_files_per_process:
        type: int
        description:
          - >-
            Sets the maximum number of open files each server subprocess is allowed to open simultaneously; files
            already opened in the postmaster are not counted toward this limit. The default is one thousand files.
          - >-
            If the kernel is enforcing a safe per-process limit, you don't need to worry about this setting. But on some
            platforms (notably, most BSD systems), the kernel will allow individual processes to open many more files
            than the system can actually support if many processes all try to open that many files. If you find yourself
            seeing “Too many open files” failures, try reducing this setting. This parameter can only be set at server
            start.

      postgresql_bgwriter_delay:
        type: str
        description: >-
          Specifies the delay between activity rounds for the background writer. In each round the writer issues writes
          for some number of dirty buffers (controllable by the following parameters). It then sleeps for the length of
          `bgwriter_delay`, and repeats. When there are no dirty buffers in the buffer pool, though, it goes into a
          longer sleep regardless of `bgwriter_delay`. If this value is specified without units, it is taken as
          milliseconds. The default value is 200 milliseconds (`200ms`). Note that on some systems, the effective
          resolution of sleep delays is 10 milliseconds; setting `bgwriter_delay` to a value that is not a multiple of
          10 might have the same results as setting it to the next higher multiple of 10. This parameter can only be set
          in the `postgresql.conf` file or on the server command line.

      postgresql_bgwriter_lru_maxpages:
        type: int
        description: >-
          In each round, no more than this many buffers will be written by the background writer. Setting this to zero
          disables background writing. (Note that checkpoints, which are managed by a separate, dedicated auxiliary
          process, are unaffected.) The default value is 100 buffers. This parameter can only be set in the
          `postgresql.conf` file or on the server command line.

      postgresql_bgwriter_lru_multiplier:
        type: float
        description: >-
          The number of dirty buffers written in each round is based on the number of new buffers that have been needed
          by server processes during recent rounds. The average recent need is multiplied by `bgwriter_lru_multiplier`
          to arrive at an estimate of the number of buffers that will be needed during the next round. Dirty buffers are
          written until there are that many clean, reusable buffers available. (However, no more than
          `bgwriter_lru_maxpages` buffers will be written per round.) Thus, a setting of 1.0 represents a “just in time”
          policy of writing exactly the number of buffers predicted to be needed. Larger values provide some cushion
          against spikes in demand, while smaller values intentionally leave writes to be done by server processes. The
          default is 2.0. This parameter can only be set in the `postgresql.conf` file or on the server command line.

      postgresql_bgwriter_flush_after:
        type: str
        description: >-
          Whenever more than this amount of data has been written by the background writer, attempt to force the OS to
          issue these writes to the underlying storage. Doing so will limit the amount of dirty data in the kernel's
          page cache, reducing the likelihood of stalls when an `fsync` is issued at the end of a checkpoint, or when
          the OS writes data back in larger batches in the background. Often that will result in greatly reduced
          transaction latency, but there also are some cases, especially with workloads that are bigger than
          `shared_buffers`, but smaller than the OS's page cache, where performance might degrade. This setting may have
          no effect on some platforms. If this value is specified without units, it is taken as blocks, that is `BLCKSZ`
          bytes, typically 8kB. The valid range is between `0`, which disables forced writeback, and `2MB`. The default
          is `512kB` on Linux, `0` elsewhere. (If `BLCKSZ` is not 8kB, the default and maximum values scale
          proportionally to it.) This parameter can only be set in the `postgresql.conf` file or on the server command
          line.

      postgresql_backend_flush_after:
        type: str
        description: >-
          Whenever more than this amount of data has been written by a single backend, attempt to force the OS to issue
          these writes to the underlying storage. Doing so will limit the amount of dirty data in the kernel's page
          cache, reducing the likelihood of stalls when an `fsync` is issued at the end of a checkpoint, or when the OS
          writes data back in larger batches in the background. Often that will result in greatly reduced transaction
          latency, but there also are some cases, especially with workloads that are bigger than shared_buffers, but
          smaller than the OS's page cache, where performance might degrade. This setting may have no effect on some
          platforms. If this value is specified without units, it is taken as blocks, that is `BLCKSZ` bytes, typically
          8kB. The valid range is between 0, which disables forced writeback, and `2MB`. The default is 0, i.e., no
          forced writeback. (If `BLCKSZ` is not 8kB, the maximum value scales proportionally to it.)

      postgresql_effective_io_concurrency:
        type: int
        description:
          - >-
            Sets the number of concurrent storage I/O operations that PostgreSQL expects can be executed simultaneously.
            Raising this value will increase the number of I/O operations that any individual PostgreSQL session
            attempts to initiate in parallel. The allowed range is `1` to `1000`, or `0` to disable issuance of
            asynchronous I/O requests. The default is `16`.
          - >-
            Higher values will have the most impact on higher latency storage where queries otherwise experience
            noticeable I/O stalls and on devices with high IOPs. Unnecessarily high values may increase I/O latency for
            all queries on the system.
          - >-
            On systems with prefetch advice support, `effective_io_concurrency` also controls the prefetch distance.
          - >-
            This value can be overridden for tables in a particular tablespace by setting the tablespace parameter of
            the same name (see ALTER TABLESPACE).

      postgresql_maintenance_io_concurrency:
        type: int
        description:
          - >-
            Similar to `effective_io_concurrency`, but used for maintenance work that is done on behalf of many client
            sessions.
          - >-
            The default is `16`. This value can be overridden for tables in a particular tablespace by setting the
            tablespace parameter of the same name (see ALTER TABLESPACE).

      postgresql_io_max_combine_limit:
        type: str
        description: >-
          Controls the largest I/O size in operations that combine I/O, and silently limits the user-settable parameter
          `io_combine_limit`. This parameter can only be set at server start. If this value is specified without units,
          it is taken as blocks, that is `BLCKSZ` bytes, typically 8kB. The maximum possible size depends on the
          operating system and block size, but is typically 1MB on Unix and 128kB on Windows. The default is 128kB.

      postgresql_io_combine_limit:
        type: str
        description: >-
          Controls the largest I/O size in operations that combine I/O. If set higher than the `io_max_combine_limit`
          parameter, the lower value will silently be used instead, so both may need to be raised to increase the I/O
          size. If this value is specified without units, it is taken as blocks, that is `BLCKSZ` bytes, typically 8kB.
          The maximum possible size depends on the operating system and block size, but is typically 1MB on Unix and
          128kB on Windows. The default is 128kB.

      postgresql_io_max_concurrency:
        type: int
        description:
          - >-
            Controls the maximum number of I/O operations that one process can execute simultaneously.
          - >-
            The default setting of `-1` selects a number based on shared_buffers and the maximum number of processes
            (max_connections, autovacuum_worker_slots, max_worker_processes and max_wal_senders), but not more than
            `64`.
          - >-
            This parameter can only be set at server start.

      postgresql_io_method:
        type: str
        choices:
          - worker
          - io_uring
          - sync
        description:
          - >-
            Selects the method for executing asynchronous I/O. Possible values are: `worker` (execute asynchronous I/O
            using worker processes), `io_uring` (execute asynchronous I/O using io_uring, requires a build with
            --with-liburing / -Dliburing), `sync` (execute asynchronous-eligible I/O synchronously)
          - >-
            The default is `worker`.
          - >-
            This parameter can only be set at server start.

      postgresql_io_workers:
        type: int
        description:
          - >-
            Selects the number of I/O worker processes to use. The default is 3. This parameter can only be set in the
            `postgresql.conf` file or on the server command line.
          - >-
            Only has an effect if io_method is set to `worker`.

      postgresql_max_worker_processes:
        type: int
        description:
          - >-
            Sets the maximum number of background processes that the cluster can support. This parameter can only be set
            at server start. The default is 8.
          - >-
            When running a standby server, you must set this parameter to the same or higher value than on the primary
            server. Otherwise, queries will not be allowed in the standby server.
          - >-
            When changing this value, consider also adjusting max_parallel_workers, max_parallel_maintenance_workers,
            and max_parallel_workers_per_gather.

      postgresql_max_parallel_workers_per_gather:
        type: int
        description:
          - >-
            Sets the maximum number of workers that can be started by a single `Gather` or `Gather Merge` node. Parallel
            workers are taken from the pool of processes established by max_worker_processes, limited by
            max_parallel_workers. Note that the requested number of workers may not actually be available at run time.
            If this occurs, the plan will run with fewer workers than expected, which may be inefficient. The default
            value is 2. Setting this value to 0 disables parallel query execution.
          - >-
            Note that parallel queries may consume very substantially more resources than non-parallel queries, because
            each worker process is a completely separate process which has roughly the same impact on the system as an
            additional user session. This should be taken into account when choosing a value for this setting, as well
            as when configuring other settings that control resource utilization, such as work_mem. Resource limits such
            as `work_mem` are applied individually to each worker, which means the total utilization may be much higher
            across all processes than it would normally be for any single process. For example, a parallel query using 4
            workers may use up to 5 times as much CPU time, memory, I/O bandwidth, and so forth as a query which uses no
            workers at all.
          - >-
            For more information on parallel query, see Chapter 15.

      postgresql_max_parallel_maintenance_workers:
        type: int
        description:
          - >-
            Sets the maximum number of parallel workers that can be started by a single utility command. Currently, the
            parallel utility commands that support the use of parallel workers are `CREATE INDEX` when building a
            B-tree, GIN, or BRIN index, and `VACUUM` without `FULL` option. Parallel workers are taken from the pool of
            processes established by max_worker_processes, limited by max_parallel_workers. Note that the requested
            number of workers may not actually be available at run time. If this occurs, the utility operation will run
            with fewer workers than expected. The default value is 2. Setting this value to 0 disables the use of
            parallel workers by utility commands.
          - >-
            Note that parallel utility commands should not consume substantially more memory than equivalent
            non-parallel operations. This strategy differs from that of parallel query, where resource limits generally
            apply per worker process. Parallel utility commands treat the resource limit `maintenance_work_mem` as a
            limit to be applied to the entire utility command, regardless of the number of parallel worker processes.
            However, parallel utility commands may still consume substantially more CPU resources and I/O bandwidth.

      postgresql_max_parallel_workers:
        type: int
        description: >-
          Sets the maximum number of workers that the cluster can support for parallel operations. The default value is
          8. When increasing or decreasing this value, consider also adjusting max_parallel_maintenance_workers and
          max_parallel_workers_per_gather. Also, note that a setting for this value which is higher than
          max_worker_processes will have no effect, since parallel workers are taken from the pool of worker processes
          established by that setting.

      postgresql_parallel_leader_participation:
        type: bool
        description: >-
          Allows the leader process to execute the query plan under `Gather` and `Gather Merge` nodes instead of waiting
          for worker processes. The default is `on`. Setting this value to off reduces the likelihood that workers will
          become blocked because the leader is not reading tuples fast enough, but requires the leader process to wait
          for worker processes to start up before the first tuples can be produced. The degree to which the leader can
          help or hinder performance depends on the plan type, number of workers and query duration.

      postgresql_wal_level:
        type: str
        choices:
          - replica
          - minimal
          - logical
          - hot_standby
        description:
          - >-
            wal_level determines how much information is written to the WAL. The default value is `replica`, which
            writes data to support WAL archiving and replication, including running read-only queries on a standby
            server. `minimal` removes all logging except the information required to recover from a crash or immediate
            shutdown. Finally, `logical` adds information necessary to support logical decoding. Each level includes the
            information logged at all lower levels. This parameter can only be set at server start.
          - >-
            The minimal level generates the least WAL volume. It logs no row information for permanent relations in
            transactions that create or rewrite them. This can make operations much faster (see Section 14.4.7).
            Operations that initiate this optimization include: `ALTER ... SET TABLESPACE`, `CLUSTER`, `CREATE TABLE`,
            `REFRESH MATERIALIZED VIEW` (without `CONCURRENTLY`), `REINDEX`, `TRUNCATE`
          - >-
            However, minimal WAL does not contain sufficient information for point-in-time recovery, so `replica` or
            higher must be used to enable continuous archiving (archive_mode) and streaming binary replication. In fact,
            the server will not even start in this mode if `max_wal_senders` is non-zero. Note that changing `wal_level`
            to minimal makes previous base backups unusable for point-in-time recovery and standby servers.
          - >-
            In logical level, the same information is logged as with `replica`, plus information needed to extract
            logical change sets from the WAL. Using a level of logical will increase the WAL volume, particularly if
            many tables are configured for `REPLICA IDENTITY FULL` and many `UPDATE` and `DELETE` statements are
            executed.
          - >-
            In releases prior to 9.6, this parameter also allowed the values archive and `hot_standby`. These are still
            accepted but mapped to `replica`.

      postgresql_fsync:
        type: bool
        description:
          - >-
            If this parameter is on, the PostgreSQL server will try to make sure that updates are physically written to
            disk, by issuing `fsync()` system calls or various equivalent methods (see `wal_sync_method`). This ensures
            that the database cluster can recover to a consistent state after an operating system or hardware crash.
          - >-
            While turning off `fsync` is often a performance benefit, this can result in unrecoverable data corruption
            in the event of a power failure or system crash. Thus it is only advisable to turn off `fsync` if you can
            easily recreate your entire database from external data.
          - >-
            Examples of safe circumstances for turning off `fsync` include the initial loading of a new database cluster
            from a backup file, using a database cluster for processing a batch of data after which the database will be
            thrown away and recreated, or for a read-only database clone which gets recreated frequently and is not used
            for failover. High quality hardware alone is not a sufficient justification for turning off `fsync`.
          - >-
            For reliable recovery when changing `fsync` off to on, it is necessary to force all modified buffers in the
            kernel to durable storage. This can be done while the cluster is shutdown or while `fsync` is on by running
            `initdb --sync-only`, running `sync`, unmounting the file system, or rebooting the server.
          - >-
            In many situations, turning off synchronous_commit for noncritical transactions can provide much of the
            potential performance benefit of turning off `fsync`, without the attendant risks of data corruption.
          - >-
            `fsync` can only be set in the `postgresql.conf` file or on the server command line. If you turn this
            parameter off, also consider turning off `full_page_writes`.

      postgresql_synchronous_commit:
        type: str
        choices:
          - remote_apply
          - "on"
          - remote_write
          - local
          - "off"
        description:
          - >-
            Specifies how much WAL processing must complete before the database server returns a “success” indication to
            the client. Valid values are `remote_apply`, `on` (the default), `remote_write`, `local`, and `off`.
          - >-
            If `synchronous_standby_names` is empty, the only meaningful settings are `on` and `off`; `remote_apply`,
            `remote_write` and `local` all provide the same local synchronization level as `on`. The local behavior of
            all non-`off` modes is to wait for local flush of WAL to disk. In `off` mode, there is no waiting, so there
            can be a delay between when success is reported to the client and when the transaction is later guaranteed
            to be safe against a server crash. (The maximum delay is three times `wal_writer_delay`.) Unlike `fsync`,
            setting this parameter to `off` does not create any risk of database inconsistency: an operating system or
            database crash might result in some recent allegedly-committed transactions being lost, but the database
            state will be just the same as if those transactions had been aborted cleanly. So, turning
            `synchronous_commit` off can be a useful alternative when performance is more important than exact certainty
            about the durability of a transaction. For more discussion see Section 28.4.
          - >-
            If `synchronous_standby_names` is non-empty, `synchronous_commit` also controls whether transaction commits
            will wait for their WAL records to be processed on the standby server(s).
          - >-
            When set to `remote_apply`, commits will wait until replies from the current synchronous standby(s) indicate
            they have received the commit record of the transaction and applied it, so that it has become visible to
            queries on the standby(s), and also written to durable storage on the standbys. This will cause much larger
            commit delays than previous settings since it waits for WAL replay. When set to `on`, commits wait until
            replies from the current synchronous standby(s) indicate they have received the commit record of the
            transaction and flushed it to durable storage. This ensures the transaction will not be lost unless both the
            primary and all synchronous standbys suffer corruption of their database storage. When set to
            `remote_write`, commits will wait until replies from the current synchronous standby(s) indicate they have
            received the commit record of the transaction and written it to their file systems. This setting ensures
            data preservation if a standby instance of PostgreSQL crashes, but not if the standby suffers an
            operating-system-level crash because the data has not necessarily reached durable storage on the standby.
            The setting local causes commits to wait for local flush to disk, but not for replication. This is usually
            not desirable when synchronous replication is in use, but is provided for completeness.
          - >-
            This parameter can be changed at any time; the behavior for any one transaction is determined by the
            setting in effect when it commits. It is therefore possible, and useful, to have some transactions commit
            synchronously and others asynchronously. For example, to make a single multistatement transaction commit
            asynchronously when the default is the opposite, issue `SET LOCAL synchronous_commit TO OFF` within the
            transaction.
          - >-
            [Table 19.1](https://www.postgresql.org/docs/18/runtime-config-wal.html#SYNCHRONOUS-COMMIT-MATRIX)
            summarizes the capabilities of the synchronous_commit settings.

      postgresql_wal_sync_method:
        type: str
        choices:
          - open_datasync
          - fdatasync
          - fsync
          - fsync_writethrough
          - open_sync
        description:
          - >-
            Method used for forcing WAL updates out to disk. If `fsync` is off then this setting is irrelevant, since
            WAL file updates will not be forced out at all. Possible values are: `open_datasync` (write WAL files with
            open() option O_DSYNC), `fdatasync` (call fdatasync() at each commit), `fsync` (call fsync() at each
            commit), `fsync_writethrough` (call fsync() at each commit, forcing write-through of any disk write cache),
            `open_sync` (write WAL files with open() option O_SYNC)
          - >-
            Not all of these choices are available on all platforms. The default is the first method in the above list
            that is supported by the platform, except that `fdatasync` is the default on Linux and FreeBSD. The default
            is not necessarily ideal; it might be necessary to change this setting or other aspects of your system
            configuration in order to create a crash-safe configuration or achieve optimal performance. These aspects
            are discussed in Section 28.1. This parameter can only be set in the `postgresql.conf` file or on the server
            command line.

      postgresql_full_page_writes:
        type: bool
        description:
          - >-
            When this parameter is on, the PostgreSQL server writes the entire content of each disk page to WAL during
            the first modification of that page after a checkpoint. This is needed because a page write that is in
            process during an operating system crash might be only partially completed, leading to an on-disk page that
            contains a mix of old and new data. The row-level change data normally stored in WAL will not be enough to
            completely restore such a page during post-crash recovery. Storing the full page image guarantees that the
            page can be correctly restored, but at the price of increasing the amount of data that must be written to
            WAL. (Because WAL replay always starts from a checkpoint, it is sufficient to do this during the first
            change of each page after a checkpoint. Therefore, one way to reduce the cost of full-page writes is to
            increase the checkpoint interval parameters.)
          - >-
            Turning this parameter off speeds normal operation, but might lead to either unrecoverable data corruption,
            or silent data corruption, after a system failure. The risks are similar to turning off `fsync`, though
            smaller, and it should be turned off only based on the same circumstances recommended for that parameter.
          - >-
            Turning off this parameter does not affect use of WAL archiving for point-in-time recovery (PITR) (see
            Section 25.3).
          - >-
            This parameter can only be set in the `postgresql.conf` file or on the server command line. The default is
            `on`.

      postgresql_wal_log_hints:
        type: bool
        description:
          - >-
            When this parameter is `on`, the PostgreSQL server writes the entire content of each disk page to WAL during
            the first modification of that page after a checkpoint, even for non-critical modifications of so-called
            hint bits.
          - >-
            If data checksums are enabled, hint bit updates are always WAL-logged and this setting is ignored. You can
            use this setting to test how much extra WAL-logging would occur if your database had data checksums enabled.
          - >-
            This parameter can only be set at server start. The default value is `off`.

      postgresql_wal_compression:
        type: str
        choices:
          - pglz
          - "on"
          - lz4
          - zstd
          - "off"
        description:
          - >-
            This parameter enables compression of WAL using the specified compression method. When enabled, the
            PostgreSQL server compresses full page images written to WAL (e.g. when `full_page_writes` is on, during a
            base backup, etc.). A compressed page image will be decompressed during WAL replay. The supported methods
            are `pglz`, `lz4` (if PostgreSQL was compiled with `--with-lz4`) and `zstd` (if PostgreSQL was compiled with
            `--with-zstd`). The value `on` is a historical spelling of `pglz`. The default value is `off`. Only
            superusers and users with the appropriate `SET` privilege can change this setting.
          - >-
            Enabling compression can reduce the WAL volume without increasing the risk of unrecoverable data corruption,
            but at the cost of some extra CPU spent on the compression during WAL logging and on the decompression
            during WAL replay.

      postgresql_wal_init_zero:
        type: bool
        description: >-
          If set to `on` (the default), this option causes new WAL files to be filled with zeroes. On some file systems,
          this ensures that space is allocated before we need to write WAL records. However, Copy-On-Write (COW) file
          systems may not benefit from this technique, so the option is given to skip the unnecessary work. If set to
          `off`, only the final byte is written when the file is created so that it has the expected size.

      postgresql_wal_recycle:
        type: bool
        description: >-
          If set to `on` (the default), this option causes WAL files to be recycled by renaming them, avoiding the need
          to create new ones. On COW file systems, it may be faster to create new ones, so the option is given to
          disable this behavior.

      postgresql_wal_buffers:
        type: str
        description:
          - >-
            The amount of shared memory used for WAL data that has not yet been written to disk. The default setting of
            -1 selects a size equal to 1/32nd (about 3%) of shared_buffers, but not less than 64kB nor more than the
            size of one WAL segment, typically 16MB. This value can be set manually if the automatic choice is too large
            or too small, but any positive value less than 32kB will be treated as 32kB. If this value is specified
            without units, it is taken as WAL blocks, that is XLOG_BLCKSZ bytes, typically 8kB. This parameter can only
            be set at server start.
          - >-
            The contents of the WAL buffers are written out to disk at every transaction commit, so extremely large
            values are unlikely to provide a significant benefit. However, setting this value to at least a few
            megabytes can improve write performance on a busy server where many clients are committing at once. The
            auto-tuning selected by the default setting of -1 should give reasonable results in most cases.

      postgresql_wal_writer_delay:
        type: str
        description: >-
          Specifies how often the WAL writer flushes WAL, in time terms. After flushing WAL the writer sleeps for the
          length of time given by `wal_writer_delay`, unless woken up sooner by an asynchronously committing
          transaction. If the last flush happened less than `wal_writer_delay` ago and less than
          `wal_writer_flush_after` worth of WAL has been produced since, then WAL is only written to the operating
          system, not flushed to disk. If this value is specified without units, it is taken as milliseconds. The
          default value is 200 milliseconds (`200ms`). Note that on some systems, the effective resolution of sleep
          delays is 10 milliseconds; setting `wal_writer_delay` to a value that is not a multiple of 10 might have the
          same results as setting it to the next higher multiple of 10. This parameter can only be set in the
          `postgresql.conf` file or on the server command line.

      postgresql_wal_writer_flush_after:
        type: str
        description: >-
          Specifies how often the WAL writer flushes WAL, in volume terms. If the last flush happened less than
          `wal_writer_delay` ago and less than `wal_writer_flush_after` worth of WAL has been produced since, then WAL
          is only written to the operating system, not flushed to disk. If `wal_writer_flush_after` is set to `0` then
          WAL data is always flushed immediately. If this value is specified without units, it is taken as WAL blocks,
          that is XLOG_BLCKSZ bytes, typically `8kB`. The default is `1MB`. This parameter can only be set in the
          `postgresql.conf` file or on the server command line.

      postgresql_wal_skip_threshold:
        type: str
        description: >-
          When `wal_level` is minimal and a transaction commits after creating or rewriting a permanent relation, this
          setting determines how to persist the new data. If the data is smaller than this setting, write it to the WAL
          log; otherwise, use an `fsync` of affected files. Depending on the properties of your storage, raising or
          lowering this value might help if such commits are slowing concurrent transactions. If this value is specified
          without units, it is taken as kilobytes. The default is two megabytes (`2MB`).

      postgresql_commit_delay:
        type: str
        description:
          - >-
            Setting commit_delay adds a time delay before a WAL flush is initiated. This can improve group commit
            throughput by allowing a larger number of transactions to commit via a single WAL flush, if system load is
            high enough that additional transactions become ready to commit within the given interval. However, it also
            increases latency by up to the `commit_delay` for each WAL flush. Because the delay is just wasted if no
            other transactions become ready to commit, a delay is only performed if at least `commit_siblings` other
            transactions are active when a flush is about to be initiated. Also, no delays are performed if `fsync` is
            disabled. If this value is specified without units, it is taken as microseconds. The default `commit_delay`
            is zero (no delay). Only superusers and users with the appropriate `SET` privilege can change this setting.
          - >-
            In PostgreSQL releases prior to 9.3, `commit_delay` behaved differently and was much less effective: it
            affected only commits, rather than all WAL flushes, and waited for the entire configured delay even if the
            WAL flush was completed sooner. Beginning in PostgreSQL 9.3, the first process that becomes ready to flush
            waits for the configured interval, while subsequent processes wait only until the leader completes the flush
            operation.

      postgresql_commit_siblings:
        type: int
        description: >-
          Minimum number of concurrent open transactions to require before performing the `commit_delay` delay. A larger
          value makes it more probable that at least one other transaction will become ready to commit during the delay
          interval. The default is five transactions.

      postgresql_checkpoint_timeout:
        type: str
        description: >-
          Maximum time between automatic WAL checkpoints. If this value is specified without units, it is taken as
          seconds. The valid range is between 30 seconds and one day. The default is five minutes (`5min`). Increasing
          this parameter can increase the amount of time needed for crash recovery. This parameter can only be set in
          the `postgresql.conf` file or on the server command line.

      postgresql_checkpoint_completion_target:
        type: float
        description: >-
          Specifies the target of checkpoint completion, as a fraction of total time between checkpoints. The default is
          `0.9`, which spreads the checkpoint across almost all of the available interval, providing fairly consistent
          I/O load while also leaving some time for checkpoint completion overhead. Reducing this parameter is not
          recommended because it causes the checkpoint to complete faster. This results in a higher rate of I/O during
          the checkpoint followed by a period of less I/O between the checkpoint completion and the next scheduled
          checkpoint. This parameter can only be set in the `postgresql.conf` file or on the server command line.

      postgresql_checkpoint_flush_after:
        type: str
        description: >-
          Whenever more than this amount of data has been written while performing a checkpoint, attempt to force the OS
          to issue these writes to the underlying storage. Doing so will limit the amount of dirty data in the kernel's
          page cache, reducing the likelihood of stalls when an fsync is issued at the end of the checkpoint, or when
          the OS writes data back in larger batches in the background. Often that will result in greatly reduced
          transaction latency, but there also are some cases, especially with workloads that are bigger than
          `shared_buffers`, but smaller than the OS's page cache, where performance might degrade. This setting may have
          no effect on some platforms. If this value is specified without units, it is taken as blocks, that is `BLCKSZ`
          bytes, typically `8kB`. The valid range is between `0`, which disables forced writeback, and `2MB`. The
          default is `256kB` on Linux, `0` elsewhere. (If `BLCKSZ` is not `8kB`, the default and maximum values scale
          proportionally to it.) This parameter can only be set in the `postgresql.conf` file or on the server command
          line.

      postgresql_checkpoint_warning:
        type: str
        description: >-
          Write a message to the server log if checkpoints caused by the filling of WAL segment files happen closer
          together than this amount of time (which suggests that `max_wal_size` ought to be raised). If this value is
          specified without units, it is taken as seconds. The default is 30 seconds (`30s`). Zero disables the warning.
          No warnings will be generated if `checkpoint_timeout` is less than `checkpoint_warning`. This parameter can
          only be set in the `postgresql.conf` file or on the server command line.

      postgresql_max_wal_size:
        type: str
        description: >-
          Maximum size to let the WAL grow during automatic checkpoints. This is a soft limit; WAL size can exceed
          `max_wal_size` under special circumstances, such as heavy load, a failing `archive_command` or
          `archive_library`, or a high `wal_keep_size` setting. If this value is specified without units, it is taken as
          megabytes. The default is 1 GB. Increasing this parameter can increase the amount of time needed for crash
          recovery. This parameter can only be set in the `postgresql.conf` file or on the server command line.

      postgresql_min_wal_size:
        type: str
        description: >-
          As long as WAL disk usage stays below this setting, old WAL files are always recycled for future use at a
          checkpoint, rather than removed. This can be used to ensure that enough WAL space is reserved to handle spikes
          in WAL usage, for example when running large batch jobs. If this value is specified without units, it is taken
          as megabytes. The default is 80 MB. This parameter can only be set in the `postgresql.conf` file or on the
          server command line.

      postgresql_archive_mode:
        type: str
        choices:
          - "off"
          - "on"
          - always
        description:
          - >-
            When `archive_mode` is enabled, completed WAL segments are sent to archive storage by setting
            `archive_command` or `archive_library`. In addition to `off`, to disable, there are two modes: `on`, and
            `always`. During normal operation, there is no difference between the two modes, but when set to `always`
            the WAL archiver is enabled also during archive recovery or standby mode. In `always` mode, all files
            restored from the archive or streamed with streaming replication will be archived (again). See Section
            26.2.9 for details.
          - >-
            `archive_mode` is a separate setting from `archive_command` and `archive_library` so that `archive_command`
            and `archive_library` can be changed without leaving archiving mode. This parameter can only be set at
            server start. `archive_mode` cannot be enabled when `wal_level` is set to `minimal`.

      postgresql_archive_command:
        type: str
        description:
          - >-
            The local shell command to execute to archive a completed WAL file segment. Any %`p` in the string is
            replaced by the path name of the file to archive, and any `%f` is replaced by only the file name. (The path
            name is relative to the working directory of the server, i.e., the cluster's data directory.) Use `%%` to
            embed an actual `%` character in the command. It is important for the command to return a zero exit status
            only if it succeeds. For more information see Section 25.3.1.
          - >-
            This parameter can only be set in the `postgresql.conf` file or on the server command line. It is only used
            if `archive_mode` was enabled at server start and `archive_library` is set to an empty string. If both
            `archive_command` and `archive_library` are set, an error will be raised. If `archive_command` is an empty
            string (the default) while `archive_mode` is enabled (and `archive_library` is set to an empty string), WAL
            archiving is temporarily disabled, but the server continues to accumulate WAL segment files in the
            expectation that a command will soon be provided. Setting `archive_command` to a command that does nothing
            but return true, e.g., `/bin/true` (`REM` on Windows), effectively disables archiving, but also breaks the
            chain of WAL files needed for archive recovery, so it should only be used in unusual circumstances.

      postgresql_archive_library:
        type: str
        description:
          - >-
            The library to use for archiving completed WAL file segments. If set to an empty string (the default),
            archiving via shell is enabled, and `archive_command` is used. If both `archive_command` and
            `archive_library` are set, an error will be raised. Otherwise, the specified shared library is used for
            archiving. The WAL archiver process is restarted by the postmaster when this parameter changes. For more
            information, see Section 25.3.1 and Chapter 49.
          - >-
            This parameter can only be set in the `postgresql.conf` file or on the server command line.

      postgresql_archive_timeout:
        type: str
        description:
          The `archive_command` or `archive_library` is only invoked for completed WAL segments. Hence, if your server
          generates little WAL traffic (or has slack periods where it does so), there could be a long delay between the
          completion of a transaction and its safe recording in archive storage. To limit how old unarchived data can
          be, you can set `archive_timeout` to force the server to switch to a new WAL segment file periodically. When
          this parameter is greater than zero, the server will switch to a new segment file whenever this amount of time
          has elapsed since the last segment file switch, and there has been any database activity, including a single
          checkpoint (checkpoints are skipped if there is no database activity). Note that archived files that are
          closed early due to a forced switch are still the same length as completely full files. Therefore, it is
          unwise to use a very short `archive_timeout` - it will bloat your archive storage. `archive_timeout` settings
          of a minute or so are usually reasonable. You should consider using streaming replication, instead of
          archiving, if you want data to be copied off the primary server more quickly than that. If this value is
          specified without units, it is taken as seconds. This parameter can only be set in the `postgresql.conf` file
          or on the server command line.

      postgresql_recovery_prefetch:
        type: str
        choices:
          - "off"
          - "on"
          - "try"
        description:
          - >-
            Whether to try to prefetch blocks that are referenced in the WAL that are not yet in the buffer pool, during
            recovery. Valid values are `off`, `on` and `try` (the default). The setting `try` enables prefetching only
            if the operating system provides support for issuing read-ahead advice.
          - >-
            Prefetching blocks that will soon be needed can reduce I/O wait times during recovery with some workloads.
            See also the `wal_decode_buffer_size` and `maintenance_io_concurrency` settings, which limit prefetching
            activity.

      postgresql_wal_decode_buffer_size:
        type: str
        description:
          A limit on how far ahead the server can look in the WAL, to find blocks to prefetch. If this value is
          specified without units, it is taken as bytes. The default is `512kB`. This parameter can only be set at
          server start.

      postgresql_restore_command:
        type: str
        description:
          - >-
            The local shell command to execute to retrieve an archived segment of the WAL file series. This parameter is
            required for archive recovery, but optional for streaming replication. Any `%f` in the string is replaced by
            the name of the file to retrieve from the archive, and any `%p` is replaced by the copy destination path
            name on the server. (The path name is relative to the current working directory, i.e., the cluster's data
            directory.) Any `%r` is replaced by the name of the file containing the last valid restart point. That is
            the earliest file that must be kept to allow a restore to be restartable, so this information can be used to
            truncate the archive to just the minimum required to support restarting from the current restore. `%r` is
            typically only used by warm-standby configurations (see Section 26.2). Write `%%` to embed an actual `%`
            character.
          - >-
            It is important for the command to return a zero exit status only if it succeeds. The command will be asked
            for file names that are not present in the archive; it must return nonzero when so asked. Examples:
            `restore_command = 'cp /mnt/server/archivedir/%f "%p"'`,
            `restore_command = 'copy "C:\\server\\archivedir\\%f" "%p"'  # Windows`
          - >-
            An exception is that if the command was terminated by a signal (other than SIGTERM, which is used as part of
            a database server shutdown) or an error by the shell (such as command not found), then recovery will abort
            and the server will not start up.
          - >-
            This parameter can only be set in the `postgresql.conf` file or on the server command line.

      postgresql_archive_cleanup_command:
        type: str
        description:
          - >-
            This optional parameter specifies a shell command that will be executed at every restartpoint. The purpose
            of `archive_cleanup_command` is to provide a mechanism for cleaning up old archived WAL files that are no
            longer needed by the standby server. Any `%r` is replaced by the name of the file containing the last valid
            restart point. That is the earliest file that must be kept to allow a restore to be restartable, and so all
            files earlier than `%r` may be safely removed. This information can be used to truncate the archive to just
            the minimum required to support restart from the current restore. The `pg_archivecleanup` module is often
            used in `archive_cleanup_command` for single-standby configurations, for example:
            `archive_cleanup_command = 'pg_archivecleanup /mnt/server/archivedir %r'`
          - >-
            Note however that if multiple standby servers are restoring from the same archive directory, you will need
            to ensure that you do not delete WAL files until they are no longer needed by any of the servers.
            `archive_cleanup_command` would typically be used in a warm-standby configuration (see Section 26.2). Write
            `%%` to embed an actual `%` character in the command.
          - >-
            If the command returns a nonzero exit status then a warning log message will be written. An exception is
            that if the command was terminated by a signal or an error by the shell (such as command not found), a fatal
            error will be raised.
          - >-
            This parameter can only be set in the `postgresql.conf` file or on the server command line.

      postgresql_recovery_end_command:
        type: str
        description:
          - >-
            This parameter specifies a shell command that will be executed once only at the end of recovery. This
            parameter is optional. The purpose of the `recovery_end_command` is to provide a mechanism for cleanup
            following replication or recovery. Any `%r` is replaced by the name of the file containing the last valid
            restart point, like in `archive_cleanup_command`.
          - >-
            If the command returns a nonzero exit status then a warning log message will be written and the database
            will proceed to start up anyway. An exception is that if the command was terminated by a signal or an error
            by the shell (such as command not found), the database will not proceed with startup.
          - >-
            This parameter can only be set in the `postgresql.conf` file or on the server command line.

      postgresql_recovery_target:
        type: str
        choices:
          - immediate
        description:
          - >-
            This parameter specifies that recovery should end as soon as a consistent state is reached, i.e., as early
            as possible. When restoring from an online backup, this means the point where taking the backup ended.
          - >-
            Technically, this is a string parameter, but 'immediate' is currently the only allowed value.

      postgresql_recovery_target_name:
        type: str
        description: >-
          This parameter specifies the named restore point (created with `pg_create_restore_point()`) to which recovery
          will proceed.

      postgresql_recovery_target_time:
        type: str
        description:
          - >-
            This parameter specifies the time stamp up to which recovery will proceed. The precise stopping point is
            also influenced by `recovery_target_inclusive`.
          - >-
            The value of this parameter is a time stamp in the same format accepted by the timestamp with time zone data
            type, except that you cannot use a time zone abbreviation (unless the `timezone_abbreviations` variable has
            been set earlier in the configuration file). Preferred style is to use a numeric offset from UTC, or you can
            write a full time zone name, e.g., `Europe/Helsinki` not `EEST`.

      postgresql_recovery_target_xid:
        type: str
        description: >-
          This parameter specifies the transaction ID up to which recovery will proceed. Keep in mind that while
          transaction IDs are assigned sequentially at transaction start, transactions can complete in a different
          numeric order. The transactions that will be recovered are those that committed before (and optionally
          including) the specified one. The precise stopping point is also influenced by `recovery_target_inclusive`.

      postgresql_recovery_target_lsn:
        type: str
        description: >-
          This parameter specifies the LSN of the write-ahead log location up to which recovery will proceed. The
          precise stopping point is also influenced by `recovery_target_inclusive`. This parameter is parsed using the
          system data type `pg_lsn`.

      postgresql_recovery_target_inclusive:
        type: bool
        description: >-
          Specifies whether to stop just after the specified recovery target (on), or just before the recovery target
          (off). Applies when `recovery_target_lsn`, `recovery_target_time`, or `recovery_target_xid` is specified. This
          setting controls whether transactions having exactly the target WAL location (LSN), commit time, or
          transaction ID, respectively, will be included in the recovery. Default is on.

      postgresql_recovery_target_timeline:
        type: str
        description:
          - >-
            Specifies recovering into a particular timeline. The value can be a numeric timeline ID or a special value.
            The value current recovers along the same timeline that was current when the base backup was taken. The
            value latest recovers to the latest timeline found in the archive, which is useful in a standby server.
            `latest` is the default.
          - >-
            To specify a timeline ID in hexadecimal (for example, if extracted from a WAL file name or history file),
            prefix it with a `0x`. For instance, if the WAL file name is `00000011000000A10000004F`, then the timeline
            ID is `0x11` (or 17 decimal).
          - >-
            You usually only need to set this parameter in complex re-recovery situations, where you need to return to a
            state that itself was reached after a point-in-time recovery. See Section 25.3.6 for discussion.

      postgresql_recovery_target_action:
        type: str
        choices:
          - pause
          - promote
          - shutdown
        description:
          - >-
            Specifies what action the server should take once the recovery target is reached. The default is `pause`,
            which means recovery will be paused. `promote` means the recovery process will finish and the server will
            start to accept connections. Finally `shutdown` will stop the server after reaching the recovery target.
          - >-
            The intended use of the `pause` setting is to allow queries to be executed against the database to check if
            this recovery target is the most desirable point for recovery. The paused state can be resumed by using
            `pg_wal_replay_resume()` (see Table 9.99), which then causes recovery to end. If this recovery target is not
            the desired stopping point, then shut down the server, change the recovery target settings to a later target
            and restart to continue recovery.
          - >-
            The `shutdown` setting is useful to have the instance ready at the exact replay point desired. The instance
            will still be able to replay more WAL records (and in fact will have to replay WAL records since the last
            checkpoint next time it is started).
          - >-
            Note that because `recovery.signal` will not be removed when `recovery_target_action` is set to `shutdown`,
            any subsequent start will end with immediate shutdown unless the configuration is changed or the
            `recovery.signal` file is removed manually.
          - >-
            This setting has no effect if no recovery target is set. If `hot_standby` is not enabled, a setting of pause
            will act the same as `shutdown`. If the recovery target is reached while a promotion is ongoing, a setting
            of `pause` will act the same as `promote`.
          - >-
            In any case, if a recovery target is configured but the archive recovery ends before the target is reached,
            the server will shut down with a fatal error.

      postgresql_summarize_wal:
        type: bool
        description:
          - >-
            Enables the WAL summarizer process. Note that WAL summarization can be enabled either on a primary or on a
            standby. This parameter can only be set in the `postgresql.conf` file or on the server command line. The
            default is off.
          - >-
            The server cannot be started with `summarize_wal=on` if `wal_level` is set to `minimal`. If
            `summarize_wal=on` is configured after server startup while `wal_level=minimal`, the summarizer will run but
            refuse to generate summary files for any WAL generated with `wal_level=minimal`.

      postgresql_wal_summary_keep_time:
        type: str
        description: >-
          Configures the amount of time after which the WAL summarizer automatically removes old WAL summaries. The file
          timestamp is used to determine which files are old enough to remove. Typically, you should set this
          comfortably higher than the time that could pass between a backup and a later incremental backup that depends
          on it. WAL summaries must be available for the entire range of WAL records between the preceding backup and
          the new one being taken; if not, the incremental backup will fail. If this parameter is set to zero, WAL
          summaries will not be automatically deleted, but it is safe to manually remove files that you know will not be
          required for future incremental backups. This parameter can only be set in the `postgresql.conf` file or on
          the server command line. If this value is specified without units, it is taken as minutes. The default is 10
          days. If `summarize_wal = off`, existing WAL summaries will not be removed regardless of the value of this
          parameter, because the WAL summarizer will not run.
